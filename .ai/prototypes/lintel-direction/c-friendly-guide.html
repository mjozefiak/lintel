<!doctype html>
<html lang="en" data-prototype-id="lintel-direction-c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lintel direction C: Friendly Guide</title>
<link rel="stylesheet" href="shared.css">
<style>
/* C. Friendly Guide: rounded type, 14-16 pt corners, soft Verdigris tints, icon circles, an illustrated side panel in onboarding, section headings as questions. Flat colour only. */
.light{--desk:#E4E1DA;--win:#FAF9F7;--side:#F0F2EF;--card:#FFFFFF;--ink:#1B1A17;--sec:#666159;--ter:#A39E95;--hair:rgba(27,26,23,.09);--fill:rgba(27,26,23,.05);--accent:#267C6C;--atext:#036152;--onacc:#FFFFFF;--tint:#E3F0EC;--tint2:#CFE5DE;--ok:#267C6C;--shadow:0 24px 60px rgba(30,40,35,.16),0 0 0 .5px rgba(27,26,23,.16)}
.dark{--desk:#0D0F0E;--win:#1A1C1B;--side:#161918;--card:#232726;--ink:#EEF1EF;--sec:#A2ABA7;--ter:#6D7672;--hair:rgba(238,241,239,.10);--fill:rgba(238,241,239,.07);--accent:#6BBDAB;--atext:#6BBDAB;--onacc:#0F1A17;--tint:#1F332E;--tint2:#28453E;--ok:#6BBDAB;--shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(238,241,239,.14)}
body{font:13.5px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.win{background:var(--win);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex:none}
.big{width:960px;height:640px}
.sidebar{width:220px;flex:none;background:var(--side);padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.sidebar .lights{padding:0 6px 16px}
.brandline{display:flex;gap:8px;align-items:center;padding:0 6px 12px;font-weight:700;font-size:15px}
.mark.s{width:22px;height:22px;color:var(--ink)}
.sfield{display:flex;gap:6px;align-items:center;background:var(--card);border-radius:10px;padding:7px 10px;color:var(--sec);margin-bottom:10px;box-shadow:0 0 0 1px var(--hair)}
.sfield .ic{width:14px;height:14px}
.sh{font-size:12px;font-weight:600;color:var(--sec);padding:12px 8px 4px}
.si{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--ink)}
.si .ci{width:26px;height:26px}
.si .ci .ic{width:14px;height:14px}
.si.on{background:var(--tint);font-weight:600;color:var(--atext)}
.si.on .ci{background:var(--accent);color:var(--onacc)}
.sp{flex:1}
.ci{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--atext);display:grid;place-items:center;flex:none}
.ci.lg{width:44px;height:44px}.ci.lg .ic{width:20px;height:20px}
.main{flex:1;min-width:0;overflow:auto;padding:26px 32px}
.card{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--hair),0 1px 3px rgba(0,0,0,.04)}
.btn{border:0;border-radius:999px;padding:6px 14px;background:var(--fill);white-space:nowrap;font-weight:500}
.btn.pri{background:var(--accent);color:var(--onacc);font-weight:600}
.btn.soft{background:var(--tint);color:var(--atext)}
.btn.lg{padding:8px 20px}
.link{border:0;background:none;color:var(--atext);padding:0;font-weight:600}
kbd{font:600 12.5px ui-rounded,-apple-system,sans-serif;background:var(--card);border-radius:8px;padding:3px 9px;box-shadow:0 0 0 1px var(--hair),0 2px 0 var(--hair)}
.pop{display:inline-flex;gap:6px;align-items:center;background:var(--fill);border-radius:10px;padding:5px 10px;white-space:nowrap;font-weight:500}
.pop .ic{width:11px;height:11px;color:var(--sec)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair);position:relative;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked=true]{background:var(--accent);box-shadow:none}.sw[aria-checked=true]::after{left:19px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
/* onboarding */
.onb{width:800px;height:560px}
.illo{width:280px;flex:none;background:var(--tint);display:flex;flex-direction:column;padding:16px 22px 22px}
.illo svg.art{width:100%;height:auto;margin:auto 0 12px}
.illo .cap{font-weight:600;color:var(--atext);font-size:14px;text-align:center}
.page{flex:1;display:flex;flex-direction:column;min-width:0}
.page .body{flex:1;padding:28px 36px 0}
.prog{display:flex;gap:10px;align-items:center;color:var(--sec);font-weight:600;font-size:12px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog .bar i{display:block;height:100%;width:80%;background:var(--accent);border-radius:3px}
.page h1{text-wrap:balance;font-size:25px;font-weight:700;margin:18px 0 6px;line-height:1.2}
.page .hint{color:var(--sec);margin:0 0 16px;font-size:14px}
.mail{overflow:hidden}
.mail .ln{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--hair)}
.mail .k{color:var(--sec);width:58px;flex:none}
.mail .txt{padding:14px 16px;min-height:96px;font-size:14.5px;line-height:1.5}
.ph{color:var(--ter)}
.listen{display:flex;gap:10px;align-items:center;color:var(--atext);font-weight:600}
.mark.l{width:22px;height:22px;color:var(--atext)}
@media (prefers-reduced-motion:no-preference){.mark.l{animation:c-pop 1s ease-in-out infinite}}
@keyframes c-pop{50%{transform:scale(.85)}}
.hold{margin-top:16px;display:flex;gap:12px;align-items:center}
.holdbtn{display:inline-flex;gap:10px;align-items:center;border:0;border-radius:999px;padding:6px 16px 6px 6px;background:var(--accent);color:var(--onacc);font-weight:600;user-select:none;touch-action:none}
.holdbtn .ci{width:30px;height:30px;background:rgba(255,255,255,.22);color:inherit}
.holdbtn kbd{background:rgba(255,255,255,.18);color:inherit;box-shadow:none}
.holdbtn[aria-pressed=true]{background:var(--atext)}
.or{color:var(--sec);font-size:12px;max-width:210px}
.ok{margin-top:14px;display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:12px;padding:10px 14px;font-weight:500}
.ok .ci{width:26px;height:26px;background:var(--accent);color:var(--onacc)}.ok .ci .ic{width:14px;height:14px}
.priv{display:flex;gap:8px;align-items:center;color:var(--sec);font-size:12.5px;margin:0 36px 12px}
.priv .ic{width:14px;height:14px;color:var(--atext)}
.page .foot{display:flex;gap:8px;align-items:center;padding:14px 20px}
/* home */
.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.date{color:var(--sec);font-weight:500}
.hello{font-size:26px;font-weight:700;line-height:1.15}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.act{padding:16px;display:flex;gap:14px;align-items:flex-start}
.act b{display:block;font-size:15px}
.act p{color:var(--sec);margin:2px 0 12px}
.recdot{width:8px;height:8px;border-radius:50%;background:#D23F31;display:inline-block}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;margin-top:20px;align-items:start}
.h{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:baseline}
.ri{display:flex;gap:12px;align-items:center;padding:9px 12px}
.ri+.ri{border-top:1px solid var(--hair)}
.ri .ci{width:30px;height:30px}.ri .ci .ic{width:15px;height:15px}
.ri .lbl{flex:1;min-width:0}
.ri .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .m{color:var(--sec);font-size:12px}
.ri .w{color:var(--sec);font-size:12px;white-space:nowrap}
.chip{margin-left:4px;font-size:11.5px;font-weight:600;color:var(--atext);background:var(--tint);border-radius:999px;padding:2px 8px;white-space:nowrap}
.setup{padding:14px}
.setup .pb{height:8px;border-radius:4px;background:var(--fill);margin:8px 0 10px;overflow:hidden}
.setup .pb i{display:block;height:100%;width:60%;background:var(--accent);border-radius:4px}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}
.ck .dot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ter)}
.ck.done .dot{background:var(--accent);color:var(--onacc);box-shadow:none}
.ck.done .dot .ic{width:12px;height:12px;stroke-width:2}
.ck.done .t{color:var(--sec)}
.ck .t{flex:1}
.ck .btn{padding:3px 10px;font-size:12px}
/* settings */
.ptop{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.ptop h2{font-size:22px;font-weight:700;margin:0}
.status{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--tint);border-radius:14px}
.status .ci{width:28px;height:28px;background:var(--accent);color:var(--onacc)}.status .ci .ic{width:14px;height:14px;stroke-width:2}
.status b{display:block}
.status span{color:var(--sec);font-size:12px}
.q{font-size:15px;font-weight:700;margin:20px 0 8px 4px}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px}
.row+.row{border-top:1px solid var(--hair)}
.row .ci{width:30px;height:30px}.row .ci .ic{width:15px;height:15px}
.row .lbl{flex:1;min-width:0;font-weight:500}
.row .help{color:var(--sec);font-size:12px;font-weight:400;margin-top:1px}
.disc{display:flex;gap:8px;align-items:center;border:0;background:var(--fill);border-radius:999px;padding:6px 14px;margin:20px 0 8px;font-weight:600}
.disc .ic{width:12px;height:12px}
.pfoot{display:flex;gap:8px;align-items:center;color:var(--sec);font-size:12.5px;margin:16px 4px 0}
.pfoot .ic{width:14px;height:14px;color:var(--atext)}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
(function () {
  const L = window.LINTEL, H = L.H;
  const sw = (k, S) => `<button class="sw" role="switch" aria-checked="${S.toggles[k]}" data-act="toggle" data-key="${k}"><span class="vh">${k}</span></button>`;
  const ci = (n, cls) => `<span class="ci ${cls || ''}">${H.ic(n)}</span>`;

  // Flat illustration: a voice (the cut ring) turns into lines of text inside three app windows. No sparkles, no gradients.
  const art = `<svg class="art" viewBox="0 0 240 220" aria-hidden="true">
    <rect x="18" y="104" width="132" height="92" rx="14" fill="var(--card)" stroke="var(--hair)"/>
    <rect x="96" y="64" width="128" height="88" rx="14" fill="var(--card)" stroke="var(--hair)"/>
    <rect x="58" y="20" width="132" height="86" rx="14" fill="var(--card)" stroke="var(--tint2)" stroke-width="2"/>
    <circle cx="74" cy="34" r="3" fill="var(--tint2)"/><circle cx="84" cy="34" r="3" fill="var(--tint2)"/>
    <rect x="72" y="50" width="96" height="7" rx="3.5" fill="var(--accent)"/>
    <rect x="72" y="64" width="78" height="7" rx="3.5" fill="var(--tint2)"/>
    <rect x="72" y="78" width="88" height="7" rx="3.5" fill="var(--tint2)"/>
    <rect x="112" y="118" width="90" height="6" rx="3" fill="var(--tint2)"/><rect x="112" y="130" width="64" height="6" rx="3" fill="var(--tint2)"/>
    <rect x="32" y="160" width="84" height="6" rx="3" fill="var(--tint2)"/><rect x="32" y="172" width="60" height="6" rx="3" fill="var(--tint2)"/>
    <g transform="translate(2 44) scale(.19)" color="var(--ink)"><path fill="currentColor" d="M99.01 19.82A112 112 0 1 1 19.82 99.01L64.25 110.92A66 66 0 1 0 110.92 64.25Z"/><circle cx="128" cy="128" r="34" fill="var(--accent)"/></g>
  </svg>`;

  function onb(S, c) {
    let body;
    if (S.dict === 'idle') body = `<span class="ph">${c.bodyPh}</span>`;
    else if (S.dict === 'listening') body = `<span class="listen">${H.mark('l')}${c.listening} <span style="color:var(--sec);font-weight:400">${c.letGo}</span></span>`;
    else body = H.esc(L.typedText()) + (S.dict === 'typing' ? '<span class="caret"></span>' : '');
    const done = S.dict === 'done';
    return `<div class="win onb" role="dialog" aria-label="${c.app}">
      <aside class="illo"><span class="lights"><i></i><i></i><i></i></span>${art}<div class="cap">${c.illoCap}</div></aside>
      <section class="page">
        <div class="body">
          <div class="prog"><span>${c.stepOf} · ${c.steps[3]}</span><span class="bar"><i></i></span></div>
          <h1>${c.onbTitle}</h1>
          <p class="hint">${c.onbHint}</p>
          <div class="card mail">
            <div class="ln"><span class="k">${c.to}</span><span>${c.toName}</span></div>
            <div class="ln"><span class="k">${c.subject}</span><span>${c.subj}</span></div>
            <div class="txt" aria-live="polite">${body}</div>
          </div>
          ${done
            ? `<div class="ok">${ci('check')}<span>${c.success} <button class="link" data-act="again">${c.again}</button></span></div>`
            : `<div class="hold"><button class="holdbtn" data-act="hold" aria-pressed="${S.dict === 'listening'}">${ci('mic')}<span>${S.dict === 'listening' ? c.listening : c.hold}</span><kbd>${c.key}</kbd></button><span class="or">${c.onbOr}</span></div>`}
        </div>
        <div class="priv">${H.ic('lock')}${c.privacy}</div>
        <div class="foot"><button class="btn lg">${c.back}</button><span class="sp"></span><button class="btn lg">${c.skip}</button><button class="btn lg pri" data-act="next" ${done ? '' : 'style="opacity:.55"'}>${c.cont}</button></div>
      </section>
    </div>`;
  }

  function sidebarMain(S, c) {
    const n = c.nav;
    const it = (k, ic) => `<button class="si ${S.nav === k ? 'on' : ''}" data-nav="${k}">${ci(ic)}<span>${n[k]}</span></button>`;
    return `<aside class="sidebar"><span class="lights"><i></i><i></i><i></i></span>
      <div class="brandline">${H.mark('s')}Lintel</div>
      <div class="sfield">${H.ic('search')}${c.searchNotes}</div>
      ${it('home', 'home')}${it('notes', 'note')}${it('meetings', 'meeting')}${it('dictations', 'mic')}${it('dictionary', 'book')}
      <span class="sp"></span>${it('settings', 'gear')}</aside>`;
  }

  function home(S, c) {
    const rec = S.rec
      ? `<span style="display:flex;gap:8px;align-items:center"><span class="recdot"></span>${c.recording} · ${L.recTime()} <button class="btn" data-act="rec">${c.stop}</button></span>`
      : `<button class="btn pri" data-act="rec">${c.startRec}</button>`;
    const items = c.items.map((r) => `<div class="ri">${ci(H.kindIcon[r.k])}<div class="lbl"><div class="t">${r.t}</div><div class="m">${r.m}${r.b ? ` <span class="chip">${r.b}</span>` : ''}</div></div><span class="w">${r.w}</span></div>`).join('');
    const ck = c.checklist.map((x) => `<div class="ck ${x.done ? 'done' : ''}"><span class="dot">${x.done ? H.ic('check') : ''}</span><span class="t">${x.t}</span>${x.a ? `<button class="btn soft">${x.a}</button>` : ''}</div>`).join('');
    return `<div class="win big">${sidebarMain(S, c)}
      <main class="main">
        <div class="top"><div><div class="date">${c.date}</div><div class="hello">${c.greet}</div></div></div>
        <div class="acts">
          <div class="card act">${ci('mic', 'lg')}<div><b>${c.dictTitle}</b><p>${c.dictSub}</p><kbd>${c.key}</kbd></div></div>
          <div class="card act">${ci('meeting', 'lg')}<div><b>${c.recTitle}</b><p>${c.recSub}</p>${rec}</div></div>
        </div>
        <div class="cols">
          <div><div class="h">${c.recent}<span class="sp"></span><button class="link" style="font-size:12.5px">${c.seeAll}</button></div><div class="card">${items}</div></div>
          ${S.setupHidden ? '<div></div>' : `<div class="card setup"><div class="h" style="margin:0">${c.setup}<span class="sp"></span><button class="link" style="font-size:12px;font-weight:500;color:var(--sec)" data-act="hide">${c.hide}</button></div><div style="color:var(--sec);font-size:12px">${c.setupN}</div><div class="pb"><i></i></div>${ck}</div>`}
        </div>
      </main></div>`;
  }

  function settings(S, c) {
    const it = ([k, l]) => `<button class="si ${S.pane === k ? 'on' : ''}" data-pane="${k}">${ci(H.sideIcon[k])}<span>${l}</span></button>`;
    const row = (icn, l, h, ctl) => `<div class="row">${ci(icn)}<div class="lbl">${l}${h ? `<div class="help">${h}</div>` : ''}</div>${ctl}</div>`;
    const more = S.more ? `<div class="card">${row('mic', c.rowMic, '', `<span class="pop">${c.micVal}${H.ic('chevd')}</span>`)}${row('clip', c.rowRestore, '', sw('restore', S))}</div>` : '';
    return `<div class="win big"><aside class="sidebar"><span class="lights"><i></i><i></i><i></i></span>
        <div class="sfield">${H.ic('search')}${c.searchSet}</div>
        ${c.side.core.map(it).join('')}<div class="sh">${c.side.addonsH}</div>${c.side.addons.map(it).join('')}<div class="sh"></div>${c.side.rest.map(it).join('')}
        <span class="sp"></span><button class="si" data-act="backhome">${ci('home')}<span>${c.nav.home}</span></button></aside>
      <main class="main">
        <div class="ptop">${ci('mic', 'lg')}<h2>${c.side.core[1][1]}</h2></div>
        <div class="status" role="status">${ci('check')}<div><b>${c.status}</b><span>${c.statusSub}</span></div></div>
        <div class="q">${c.q.shortcut}</div>
        <div class="card">${row('kbd', c.rowDictate, c.helpDictate, `<kbd>${c.key}</kbd>`)}</div>
        <div class="q">${c.q.writing}</div>
        <div class="card">${row('text', c.rowTidy, c.helpTidy, sw('tidy', S))}${row('globe', c.rowLang, c.langVal, `<button class="btn">${c.change}</button>`)}</div>
        <div class="q">${c.q.words}</div>
        <div class="card">${row('book', c.rowDict, c.helpDict, `<button class="btn soft">${c.openDict}</button>`)}</div>
        <div class="q">${c.q.history}</div>
        <div class="card">${row('clock', c.rowKeep, c.helpKeep, `<span class="pop">${c.keepVal}${H.ic('chevd')}</span>`)}</div>
        <button class="disc" data-act="more" aria-expanded="${S.more}">${H.ic(S.more ? 'chevd' : 'chev')}${c.more}</button>
        ${more}
        <div class="pfoot">${H.ic('lock')}${c.privacy}</div>
      </main></div>`;
  }

  window.SKETCH = { id: 'c', name: 'C · Friendly Guide', screens: { onb, home, set: settings } };
})();
</script>
</body>
</html>
