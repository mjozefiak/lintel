<!doctype html>
<html lang="en" data-prototype-id="lintel-direction-a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lintel direction A: Quiet Native</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A. Quiet Native: a first-party Apple look. Cool system greys, accent only on selection, toggles and the primary button. */
.light{--desk:#DCDCE0;--win:#F2F2F4;--side:#E6E6E9;--group:#FFFFFF;--ink:#1D1D1F;--sec:#6E6E73;--ter:#A1A1A6;--hair:rgba(0,0,0,.09);--fill:rgba(0,0,0,.05);--accent:#267C6C;--atext:#036152;--onacc:#FFFFFF;--ok:#248A3D;--shadow:0 20px 50px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.18)}
.dark{--desk:#0E0E10;--win:#1E1E20;--side:#28282B;--group:#2C2C2F;--ink:#F5F5F7;--sec:#98989D;--ter:#6C6C70;--hair:rgba(255,255,255,.09);--fill:rgba(255,255,255,.07);--accent:#6BBDAB;--atext:#6BBDAB;--onacc:#0F1A17;--ok:#30D158;--shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14)}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.win{background:var(--win);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex:none}
.big{width:960px;height:640px}
.sidebar{width:220px;flex:none;background:var(--side);border-right:1px solid var(--hair);padding:14px 10px;display:flex;flex-direction:column;gap:1px}
.sidebar .lights{padding:0 4px 14px}
.sfield{display:flex;gap:6px;align-items:center;background:var(--fill);border-radius:7px;padding:5px 8px;color:var(--sec);margin-bottom:10px}
.sfield .ic{width:14px;height:14px}
.sh{font-size:11px;font-weight:600;color:var(--sec);padding:10px 8px 3px}
.si{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;border:0;background:none;text-align:left;width:100%}
.si .ic{color:var(--accent)}
.si.on{background:var(--accent);color:var(--onacc)}.si.on .ic{color:var(--onacc)}
.sp{flex:1}
.main{flex:1;min-width:0;overflow:auto;padding:24px 32px}
.group{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--hair)}
.row{display:flex;gap:12px;align-items:center;padding:9px 12px;min-height:40px}
.row+.row{border-top:1px solid var(--hair)}
.row .lbl{flex:1;min-width:0}
.row .help{color:var(--sec);font-size:12px;margin-top:1px}
.gh{font-size:13px;font-weight:600;margin:20px 0 6px 2px}
.btn{border:0;border-radius:6px;padding:4px 12px;background:var(--fill);box-shadow:0 0 0 .5px var(--hair);white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--onacc);box-shadow:none;font-weight:500}
.btn.lg{padding:6px 16px;font-size:13px}
.link{border:0;background:none;color:var(--atext);padding:0}
kbd{font:500 12px -apple-system,sans-serif;background:var(--fill);border-radius:5px;padding:2px 8px;box-shadow:0 0 0 .5px var(--hair)}
.pop{display:inline-flex;gap:6px;align-items:center;background:var(--fill);border-radius:6px;padding:3px 8px;box-shadow:0 0 0 .5px var(--hair);white-space:nowrap}
.pop .ic{width:11px;height:11px;color:var(--sec)}
.sw{width:32px;height:19px;border-radius:10px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair);position:relative;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked=true]{background:var(--accent);box-shadow:none}.sw[aria-checked=true]::after{left:15px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
/* onboarding */
.onb{width:720px;height:560px;flex-direction:column}
.onb .top{display:flex;align-items:center;padding:14px 16px}
.dots{display:flex;gap:6px;margin:0 auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ter);opacity:.5}
.dots i.done{background:var(--sec);opacity:1}.dots i.cur{background:var(--accent);opacity:1;width:20px;border-radius:4px}
.onb .body{flex:1;padding:4px 72px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.onb .step{color:var(--sec);font-size:12px}
.onb h1{text-wrap:balance;font-size:22px;font-weight:600;margin:4px 0 6px;letter-spacing:-.01em}
.onb .hint{color:var(--sec);margin:0 0 18px}
.mail{width:100%;text-align:left}
.mail .row{min-height:34px;padding:6px 12px}
.mail .k{color:var(--sec);width:60px;flex:none}
.mail .txt{padding:12px;min-height:96px;border-top:1px solid var(--hair);font-size:14px;line-height:1.5}
.ph{color:var(--ter)}
.listen{display:flex;gap:8px;align-items:center;color:var(--atext)}
.hold{margin-top:16px;display:flex;gap:10px;align-items:center}
.holdbtn{display:inline-flex;gap:8px;align-items:center;border:0;border-radius:8px;padding:7px 14px;background:var(--group);box-shadow:0 0 0 .5px var(--hair),0 1px 2px rgba(0,0,0,.08);user-select:none;touch-action:none}
.holdbtn[aria-pressed=true]{background:var(--accent);color:var(--onacc)}
.holdbtn kbd{background:transparent}
.or{color:var(--sec);font-size:12px;margin-top:8px}
.ok{display:flex;gap:8px;align-items:baseline;margin-top:14px;color:var(--ink);max-width:520px;text-align:left}
.ok .ic{transform:translateY(3px)}
.ok .ic{color:var(--ok)}
.onb .foot{display:flex;gap:8px;align-items:center;padding:14px 16px;border-top:1px solid var(--hair)}
.priv{display:flex;gap:6px;align-items:center;color:var(--sec);font-size:12px;justify-content:center;margin:auto 0 14px}
.priv .ic{width:13px;height:13px}
.mark.m{width:40px;height:40px;color:var(--ink);margin:6px 0 10px}
.mark.s{width:16px;height:16px;color:var(--ink)}
.mark.l{width:16px;height:16px;color:var(--atext)}
@media (prefers-reduced-motion:no-preference){.mark.l{animation:a-pulse 1.2s ease-in-out infinite}}
@keyframes a-pulse{50%{opacity:.45}}
/* home */
.date{color:var(--sec);font-size:12px}
.hello{font-size:26px;font-weight:700;margin:2px 0 18px;letter-spacing:-.01em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{padding:14px;display:flex;gap:12px;align-items:flex-start}
.act .ic{width:20px;height:20px;color:var(--accent);margin-top:1px}
.act b{display:block;font-size:14px}
.act .help{color:var(--sec);margin:2px 0 10px}
.recdot{width:8px;height:8px;border-radius:50%;background:#FF3B30;display:inline-block}
.ri .ic{color:var(--sec)}
.ri .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .m{color:var(--sec);font-size:12px}
.ri .w{color:var(--sec);font-size:12px;white-space:nowrap}
.tag{font-size:11px;color:var(--atext);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px;padding:1px 6px;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.ck .ic{width:15px;height:15px}
.ck.done .lbl{color:var(--sec)}
.ck.done .ic{color:var(--ok)}
.circ{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.3px var(--ter);flex:none}
/* settings */
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ptitle h2{font-size:17px;font-weight:600;margin:0}
.status{display:flex;gap:10px;align-items:center;padding:10px 12px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.status .help{color:var(--sec);font-size:12px}
.disc{display:flex;gap:6px;align-items:center;border:0;background:none;padding:0;margin:20px 0 6px 2px;font-weight:600;color:var(--ink)}
.disc .ic{width:12px;height:12px;color:var(--sec)}
.pfoot{color:var(--sec);font-size:12px;margin:18px 2px 0;display:flex;gap:6px;align-items:center}
.pfoot .ic{width:13px;height:13px}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
(function () {
  const L = window.LINTEL, H = L.H;
  const sw = (k, S) => `<button class="sw" role="switch" aria-checked="${S.toggles[k]}" data-act="toggle" data-key="${k}"><span class="vh">${k}</span></button>`;

  function onb(S, c) {
    const steps = c.steps.map((s, i) => `<i class="${i < 3 ? 'done' : i === 3 ? 'cur' : ''}" title="${s}"></i>`).join('');
    let body;
    if (S.dict === 'idle') body = `<span class="ph">${c.bodyPh}</span>`;
    else if (S.dict === 'listening') body = `<span class="listen">${H.mark('l')}${c.listening} <span style="color:var(--sec)">${c.letGo}</span></span>`;
    else body = H.esc(L.typedText()) + (S.dict === 'typing' ? '<span class="caret"></span>' : '');
    const done = S.dict === 'done';
    return `<div class="win onb" role="dialog" aria-label="${c.app}">
      <div class="top"><span class="lights"><i></i><i></i><i></i></span><span class="dots" aria-label="${c.stepOf}">${steps}</span><span style="width:52px"></span></div>
      <div class="body">
        ${H.mark('m')}
        <div class="step">${c.stepOf} · ${c.steps[3]}</div>
        <h1>${c.onbTitle}</h1>
        <p class="hint">${c.onbHint}</p>
        <div class="group mail">
          <div class="row"><span class="k">${c.to}</span><span>${c.toName}</span></div>
          <div class="row"><span class="k">${c.subject}</span><span>${c.subj}</span></div>
          <div class="txt" aria-live="polite">${body}</div>
        </div>
        ${done
          ? `<div class="ok">${H.ic('check')}<span>${c.success} <button class="link" data-act="again">${c.again}</button></span></div>`
          : `<div class="hold"><button class="holdbtn" data-act="hold" aria-pressed="${S.dict === 'listening'}">${H.ic('mic')}<span>${S.dict === 'listening' ? c.listening : c.hold}</span><kbd>${c.key}</kbd></button></div><div class="or">${c.onbOr}</div>`}
        <div class="priv">${H.ic('lock')}${c.privacy}</div>
      </div>
      <div class="foot"><button class="btn lg">${c.back}</button><span class="sp"></span><button class="btn lg">${c.skip}</button><button class="btn lg pri" data-act="next" ${done ? '' : 'style="opacity:.55"'}>${c.cont}</button></div>
    </div>`;
  }

  function sidebarMain(S, c) {
    const n = c.nav;
    const it = (k, ic) => `<button class="si ${S.nav === k ? 'on' : ''}" data-nav="${k}">${H.ic(ic)}<span>${n[k]}</span></button>`;
    return `<aside class="sidebar"><span class="lights"><i></i><i></i><i></i></span>
      <div class="sfield">${H.ic('search')}${c.searchNotes}</div>
      ${it('home', 'home')}${it('notes', 'note')}${it('meetings', 'meeting')}${it('dictations', 'mic')}${it('dictionary', 'book')}
      <span class="sp"></span>${it('settings', 'gear')}</aside>`;
  }

  function home(S, c) {
    const rec = S.rec
      ? `<span style="display:flex;gap:8px;align-items:center"><span class="recdot"></span>${c.recording} · ${L.recTime()} <button class="btn" data-act="rec">${c.stop}</button></span>`
      : `<button class="btn pri" data-act="rec">${c.startRec}</button>`;
    const items = c.items.map((r) => `<div class="row ri">${H.ic(H.kindIcon[r.k])}<div class="lbl"><div class="t">${r.t}</div><div class="m">${r.m}</div></div>${r.b ? `<span class="tag">${r.b}</span>` : ''}<span class="w">${r.w}</span></div>`).join('');
    const ck = c.checklist.map((x) => `<div class="row ck ${x.done ? 'done' : ''}">${x.done ? H.ic('check') : '<span class="circ"></span>'}<span class="lbl">${x.t}</span>${x.a ? `<button class="btn">${x.a}</button>` : ''}</div>`).join('');
    return `<div class="win big">${sidebarMain(S, c)}
      <main class="main">
        <div class="date">${c.date}</div>
        <div class="hello">${c.greet}</div>
        <div class="acts">
          <div class="group act">${H.ic('mic')}<div><b>${c.dictTitle}</b><div class="help">${c.dictSub}</div><kbd>${c.key}</kbd></div></div>
          <div class="group act">${H.ic('meeting')}<div><b>${c.recTitle}</b><div class="help">${c.recSub}</div>${rec}</div></div>
        </div>
        <div class="cols">
          <div><div class="gh" style="display:flex">${c.recent}<span class="sp"></span><button class="link" style="font-weight:400">${c.seeAll}</button></div><div class="group">${items}</div></div>
          ${S.setupHidden ? '<div></div>' : `<div><div class="gh" style="display:flex">${c.setup}<span class="sp"></span><span style="color:var(--sec);font-weight:400">${c.setupN}</span></div><div class="group">${ck}</div><div style="text-align:right;margin-top:6px"><button class="link" data-act="hide">${c.hide}</button></div></div>`}
        </div>
      </main></div>`;
  }

  function settings(S, c) {
    const it = ([k, l]) => `<button class="si ${S.pane === k ? 'on' : ''}" data-pane="${k}">${H.ic(H.sideIcon[k])}<span>${l}</span></button>`;
    const more = S.more ? `<div class="group">
        <div class="row"><span class="lbl">${c.rowMic}</span><span class="pop">${c.micVal}${H.ic('chevd')}</span></div>
        <div class="row"><span class="lbl">${c.rowRestore}</span>${sw('restore', S)}</div></div>` : '';
    return `<div class="win big"><aside class="sidebar"><span class="lights"><i></i><i></i><i></i></span>
        <div class="sfield">${H.ic('search')}${c.searchSet}</div>
        ${c.side.core.map(it).join('')}<div class="sh">${c.side.addonsH}</div>${c.side.addons.map(it).join('')}<div class="sh"></div>${c.side.rest.map(it).join('')}
        <span class="sp"></span><button class="si" data-act="backhome">${H.ic('home')}<span>${c.nav.home}</span></button></aside>
      <main class="main">
        <div class="ptitle"><h2>${c.side.core[1][1]}</h2></div>
        <div class="group status" role="status"><span class="dot"></span><div><div>${c.status}</div><div class="help">${c.statusSub}</div></div></div>
        <div class="gh">${c.secShortcut}</div>
        <div class="group"><div class="row"><div class="lbl">${c.rowDictate}<div class="help">${c.helpDictate}</div></div><kbd>${c.key}</kbd></div></div>
        <div class="gh">${c.secWriting}</div>
        <div class="group">
          <div class="row"><div class="lbl">${c.rowTidy}<div class="help">${c.helpTidy}</div></div>${sw('tidy', S)}</div>
          <div class="row"><div class="lbl">${c.rowLang}<div class="help">${c.langVal}</div></div><button class="btn">${c.change}</button></div></div>
        <div class="gh">${c.secWords}</div>
        <div class="group"><div class="row"><div class="lbl">${c.rowDict}<div class="help">${c.helpDict}</div></div><button class="btn">${c.openDict}</button></div></div>
        <div class="gh">${c.secHistory}</div>
        <div class="group"><div class="row"><div class="lbl">${c.rowKeep}<div class="help">${c.helpKeep}</div></div><span class="pop">${c.keepVal}${H.ic('chevd')}</span></div></div>
        <button class="disc" data-act="more" aria-expanded="${S.more}">${H.ic(S.more ? 'chevd' : 'chev')}${c.more}</button>
        ${more}
        <div class="pfoot">${H.ic('lock')}${c.privacy}</div>
      </main></div>`;
  }

  window.SKETCH = { id: 'a', name: 'A · Quiet Native', screens: { onb, home, set: settings } };
})();
</script>
</body>
</html>
